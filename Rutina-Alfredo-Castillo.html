<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Champion Academy · Rutina</title>
<style>
:root{
  --bg:#0c0c0e; --bg2:#151518; --card:#1a1a1e; --line:#2a2a30;
  --gold:#e8b923; --gold2:#f6d86a; --gold-dim:#8a6f14; --soft:#2a2410; --ink:#201a00; --glow:#e8b92388; --glow0:#e8b92300; --tint:#fbf3d3; --deep:#7a5c00; --deep2:#5c4700; --deep3:#b88a00;
  --text:#f4f4f5; --muted:#9a9aa3; --ok:#3ecf8e; --ok-soft:#3ecf8e14;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;
  background-image:radial-gradient(circle at 1px 1px,#222226 1px,transparent 0);background-size:14px 14px;
  min-height:100vh;min-height:100dvh;padding-bottom:calc(104px + env(safe-area-inset-bottom));overflow-x:hidden}
body:has(.modal.open){overflow:hidden}
button{font:inherit;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
#printDoc{display:none}

/* ---------- Header ---------- */
header.hero{padding:calc(14px + env(safe-area-inset-top)) 16px 6px;text-align:center;position:relative;overflow:hidden}
header.hero::before,header.hero::after{content:"";position:absolute;width:54px;height:54px;border-top:3px solid var(--gold);border-left:3px solid var(--gold);opacity:.8;box-shadow:-4px -4px 14px var(--glow)}
header.hero::before{left:-30px;top:44px;transform:rotate(-45deg)}
header.hero::after{right:-30px;top:44px;transform:rotate(135deg)}
.logo{width:min(84px,26vw);margin:0 auto 4px}
.logo img{display:block;width:100%;height:auto}
.hero h1{margin:4px 0 2px;font-size:clamp(1.25rem,5.4vw,1.6rem);font-weight:800;color:var(--gold2);overflow-wrap:anywhere}
.hero .sub{color:var(--muted);font-size:.88rem}

.meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 12px}
.pill{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.78rem;color:var(--muted);text-align:center}
.pill b{color:var(--gold)}
.obj{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.obj h3{margin:0 0 6px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.obj ul{margin:0;padding-left:18px;font-size:.9rem}

/* ---------- Semana ---------- */
.week{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 0 10px;margin-top:-2px;box-shadow:0 10px 12px -10px #000}
.week-t{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px;display:flex;justify-content:space-between;gap:8px}
.week-in{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.tab{background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:7px 0 8px;text-align:center;cursor:pointer;font-size:.66rem;position:relative;min-height:62px}
.tab strong{display:block;font-size:1rem;color:var(--text);margin-top:1px}
.tab.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.tab.on strong{color:var(--ink)}
.tab.today::after{content:"HOY";white-space:nowrap;width:max-content;position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--bg);color:var(--gold);border:1px solid var(--gold);font-size:.5rem;font-weight:800;letter-spacing:.06em;padding:0 5px;border-radius:99px;line-height:1.5}
.ring{--p:0;width:22px;height:22px;border-radius:50%;margin:5px auto 0;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#34343b 0)}
.ring span{width:14px;height:14px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.tab.on .ring{background:conic-gradient(var(--ink) calc(var(--p)*1%),#00000030 0)}
.tab.on .ring span{background:var(--gold)}
.ring.full{background:var(--gold)}
.ring.full span{background:var(--gold);color:var(--ink);font-size:.7rem;font-weight:900}
.tab.on .ring.full{background:var(--ink)}
.tab.on .ring.full span{background:var(--ink);color:var(--gold2)}
.tab.future .ring{opacity:.4}

/* ---------- Día ---------- */
.dayhead{margin:14px 0 14px}
.dayhead h2{margin:0;font-size:1.2rem;line-height:1.25;overflow-wrap:anywhere}
.dayhead small{display:inline-block;color:var(--gold);background:var(--soft);font-weight:700;font-size:.72rem;border-radius:99px;padding:2px 10px;margin-top:6px}
.bar{height:10px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold2));border-radius:99px;transition:width .35s}
.barlbl{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:6px}
.barlbl b{color:var(--gold2)}

.circ{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.circ-h{background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--ink);font-weight:800;padding:9px 16px;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.circ-h em{font-style:normal;font-weight:700;font-size:.72rem;background:#00000018;border-radius:99px;padding:2px 9px;letter-spacing:.02em;text-transform:none;white-space:nowrap}
.ex{padding:14px 16px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-n{font-weight:650;font-size:1rem;min-width:0;overflow-wrap:anywhere}
.reps{flex:none;text-align:right;color:var(--gold);font-weight:800;font-size:.95rem;white-space:nowrap}
.reps small{display:block;color:var(--muted);font-weight:500;font-size:.64rem;text-transform:uppercase;letter-spacing:.06em}
.ex-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.note{font-size:.8rem;color:var(--gold2);background:var(--soft);border-left:3px solid var(--gold);padding:4px 8px;border-radius:0 6px 6px 0;display:inline-block}
.tech{min-height:40px;background:none;border:1px solid var(--gold);color:var(--gold2);border-radius:99px;padding:6px 14px;font-weight:800;font-size:.82rem;cursor:pointer}
.tech[aria-expanded=true]{background:var(--soft)}
.tech-panel{display:none;margin-top:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px}
.tech-panel.open{display:block}
.tech-panel .media{margin:0 0 8px}
.tech-panel .tec{margin:0 0 8px!important;font-size:.88rem!important}
.tech-panel .btn{margin-top:0;min-height:44px}
.dots{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg2);color:var(--muted);font-weight:700;cursor:pointer;transition:.15s;user-select:none;-webkit-user-select:none}
.dot.on{background:var(--gold);border-color:var(--gold);color:var(--ink);transform:scale(1.05)}
.ex.complete{background:var(--ok-soft)}
.ex.complete .ex-n{color:var(--ok)}
.ex.complete .ex-n::after{content:" ✓"}

.cardio{border-color:var(--gold-dim)}
.cardio .circ-h{background:var(--bg2);color:var(--gold);border-bottom:1px solid var(--gold-dim)}
.cardio .circ-h em{background:#ffffff14}

.rest{text-align:center;padding:24px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px;margin-bottom:14px}
.rest b{display:block;font-size:1.1rem;color:var(--text);margin-bottom:4px}
.cta-week{background:linear-gradient(160deg,var(--soft),var(--card));border:1px solid var(--gold-dim);border-radius:16px;padding:16px;margin-bottom:14px;text-align:center}
.cta-week b{color:var(--gold2);display:block;font-size:1.05rem;margin-bottom:4px}
.cta-week p{margin:0 0 12px;color:#cfcfd2;font-size:.85rem}
.err{text-align:center;padding:40px 16px;color:var(--muted)}
.err b{display:block;color:var(--text);font-size:1.2rem;margin-bottom:6px}

.actions{display:grid;gap:10px;margin-top:6px}
.btn{display:block;width:100%;min-height:48px;text-align:center;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.out{background:none;border-color:var(--gold);color:var(--gold2)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:600;font-size:.82rem}
.slogan{text-align:center;font-style:italic;font-weight:900;font-size:1.6rem;color:var(--gold);margin:26px 0 8px}

/* ---------- Botón flotante: Mi progreso ---------- */
.fab-prog{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 18px 8px 8px;border:0;border-radius:999px;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);font-weight:900;font-size:.95rem;box-shadow:0 8px 24px #000c,0 0 0 0 var(--glow);animation:glow 3.2s ease-out infinite}
.fab-prog .ico{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold2);display:grid;place-items:center;font-size:1.15rem}
@keyframes glow{0%{box-shadow:0 8px 24px #000c,0 0 0 0 var(--glow)}70%,100%{box-shadow:0 8px 24px #000c,0 0 0 16px var(--glow0)}}
body:has(.modal.open) .fab-prog{display:none}

/* ---------- Modales ---------- */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-220%);opacity:0;visibility:hidden;z-index:40;background:var(--gold);color:var(--ink);font-weight:800;font-size:.9rem;padding:11px 18px;border-radius:14px;box-shadow:0 8px 24px #000a;max-width:min(92vw,420px);text-align:center;transition:transform .3s,opacity .3s,visibility .3s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:30;overscroll-behavior:contain}
.modal.open{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain}
.sheet h3{margin:0 0 4px}
.sheet p{color:var(--muted);font-size:.85rem;margin:4px 0 14px}
.sheet .btn{margin-top:6px}

.rv-top{text-align:center}
.rv-ring{--p:0;width:132px;height:132px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#2a2a30 0)}
.rv-ring div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;align-content:center}
.rv-ring b{font-size:2rem;line-height:1;color:var(--gold2)}
.rv-ring small{color:var(--muted);font-size:.7rem}
.rv-title{margin:0;font-size:1.15rem}
.rv-sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.rv-phrase{background:#16161a;border:1px solid var(--line);border-bottom:4px solid var(--gold);border-radius:16px;padding:18px 14px 14px;margin:14px 0;text-align:center}
.rv-phrase img{display:block;width:min(100%,360px);max-height:110px;object-fit:contain;margin:0 auto 12px}
.rv-phrase p{margin:0;color:#e9e9ea;font-size:.92rem}
.rv-miss h4{margin:12px 0 4px;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.rv-miss ul{margin:0 0 4px;padding-left:18px;font-size:.88rem}
.rv-miss li{margin:2px 0;overflow-wrap:anywhere}
.rv-miss li span{color:var(--muted)}
.rv-ok{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.9rem;text-align:center}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.tiles div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.tiles b{display:block;font-size:1.3rem;color:var(--gold2);line-height:1.15}
.tiles small{color:var(--muted);font-size:.68rem}
.pg-h{margin:18px 0 6px;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.pg-note{font-size:.76rem!important;margin:6px 0 0!important}
.wk{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:18px}
.wk-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.wk-bar{width:100%;max-width:34px;background:linear-gradient(0deg,var(--gold-dim),var(--gold));border-radius:6px 6px 2px 2px;min-height:2px}
.wk-v{font-size:.64rem;color:var(--gold2);font-weight:700}
.wk-l{font-size:.62rem;color:var(--muted);white-space:nowrap}

.media{border-radius:14px;overflow:hidden;background:#000;margin:6px 0 10px;border:1px solid var(--line)}
.media img,.media video{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain}
.media iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.tec{font-size:.9rem!important;color:var(--text)!important}

@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
@media(max-width:359px){
  .tab{font-size:.6rem;min-height:58px}.tab strong{font-size:.92rem}
  .ring{width:20px;height:20px}.ring span{width:12px;height:12px}
  .reps{font-size:.85rem}.dots{gap:6px}
  .circ-h{font-size:.75rem;padding:8px 12px}.ex{padding:12px}
  .tiles b{font-size:1.1rem}.fab-prog{font-size:.85rem;padding-right:14px}
}
@media(max-height:520px) and (orientation:landscape){.week{position:static;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- PDF / impresión ---------- */
@page{size:A4;margin:10mm}
@media print{
  :root{color-scheme:light}
  html,body{background:#fff!important;color:#111!important}
  body{background-image:none!important;padding:0!important;min-height:0}
  .wrap,header.hero,.fab-prog,.modal,.toast{display:none!important}
  #printDoc{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:10.5pt;color:#111}
  .pd-head{display:flex;align-items:center;gap:14px;background:#0c0c0e;color:#fff;border-radius:10px;padding:10px 16px;margin-bottom:10px}
  .pd-head img{width:62px;height:auto;flex:none}
  .pd-head h1{margin:0;font-size:18pt;color:var(--gold2)}
  .pd-head p{margin:2px 0 0;color:#e9e9ea;font-size:10pt}
  .pd-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 6px;font-size:9.5pt;color:#444}
  .pd-meta b{color:var(--deep)}
  .pd-obj{margin:0 0 10px;padding:6px 10px;border-left:4px solid var(--gold);background:var(--tint);font-size:9.5pt}
  .pd-block{margin-top:12px}
  .pd-block>h2{margin:0;font-size:13pt;background:var(--gold);color:var(--ink);padding:5px 10px;border-radius:6px 6px 0 0;break-after:avoid}
  .pd-days{margin:0;padding:3px 10px;font-size:9pt;background:var(--tint);color:var(--deep2);font-weight:700;break-after:avoid}
  table.pd{width:100%;table-layout:fixed;border-collapse:collapse;margin:0 0 8px;break-inside:avoid;page-break-inside:avoid}
  table.pd th:nth-child(1){width:35%}table.pd th:nth-child(2){width:12%}table.pd th:nth-child(3){width:10%}table.pd th:nth-child(4){width:25%}table.pd th:nth-child(5){width:18%}
  table.pd th:nth-child(2),table.pd th:nth-child(3),table.pd th:nth-child(5){text-align:center}
  table.pd caption{caption-side:top;text-align:left;font-weight:800;font-size:9.5pt;text-transform:uppercase;letter-spacing:.05em;padding:6px 4px 2px;color:var(--deep)}
  table.pd th{background:#0c0c0e;color:var(--gold2);font-size:8.5pt;text-align:left;padding:4px 6px;text-transform:uppercase;letter-spacing:.04em}
  table.pd td{padding:5px 6px;border-bottom:1px solid #ddd;vertical-align:middle;font-size:10pt}
  table.pd td.c{text-align:center;white-space:nowrap}
  table.pd td.n{font-weight:700}
  table.pd td.i{font-size:9pt;color:var(--deep2)}
  .pd-box{display:inline-block;width:11px;height:11px;border:1.4px solid #333;border-radius:2px;margin-right:4px;vertical-align:middle}
  .pd-foot{margin-top:12px;text-align:center;font-style:italic;font-weight:900;font-size:14pt;color:var(--deep3)}
  .pd-foot small{display:block;font-style:normal;font-weight:400;font-size:8pt;color:#777;margin-top:2px}
}
</style>
</head>

const R = CONFIG;

const USER = String(R.id||R.cliente||'rutina').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'rutina';

const $ = id=>document.getElementById(id);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n=>String(n).padStart(2,'0');
const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const wdOf = d=>((d.getDay()+6)%7)+1;                        // Lun=1 … Dom=7

const startOfToday = (()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const todayNum = wdOf(startOfToday);
const monday = (()=>{const d=new Date(startOfToday);d.setDate(d.getDate()-(todayNum-1));return d})();
const dateOf = n=>{const d=new Date(monday);d.setDate(monday.getDate()+n-1);return d};
let selDay = todayNum;

/* ---------------- Almacenamiento ----------------
   Una entrada por usuario + fecha real: { idEjercicio: seriesHechas } */
const keyOf = date=>`ca3:${USER}:${ymd(date)}`;
const readP = date=>{try{return JSON.parse(localStorage.getItem(keyOf(date))||'{}')}catch(e){return {}}};
const writeP = (date,p)=>{try{localStorage.setItem(keyOf(date),JSON.stringify(p))}catch(e){}};
const getP = n=>readP(dateOf(n));
const setP = (n,p)=>writeP(dateOf(n),p);

/* ---------------- Plan y cálculos ---------------- */
function bloquesDelDia(d){ return R.bloques.map((b,bi)=>({b,bi})).filter(x=>x.b.dias.includes(d)); }
function planItems(n){
  const items=[];
  bloquesDelDia(n).forEach(({b,bi})=>b.circuitos.forEach((c,ci)=>c.ejercicios.forEach((e,ei)=>
    items.push({id:`${bi}-${ci}-${ei}`,n:e.n,s:Math.max(1,parseInt(e.series)||1)}))));
  (R.cardio||[]).forEach((c,i)=>items.push({id:`c-${i}`,n:`${c.n}${c.tiempo?` (${c.tiempo})`:''}`,s:1}));
  return items;
}
function statsOf(date){
  const P=readP(date), items=planItems(wdOf(date)); let t=0,d=0; const miss=[];
  items.forEach(it=>{ const k=Math.min(+P[it.id]||0,it.s); t+=it.s; d+=k; if(k<it.s) miss.push({...it,done:k}); });
  return {t,d,pct:t?Math.round(d/t*100):0,miss};
}
const dayStats = n=>statsOf(dateOf(n));
const firstName = ()=>String(R.cliente||'').trim().split(/\s+/)[0]||'campeón';
const generoOf = ()=>{const g=norm(R.genero); return /^(muj|fem)/.test(g)?'mujer':/^(hom|mas|var)/.test(g)?'hombre':'';};

const buzz = p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------------- Técnica (video / GIF dentro de la tarjeta) ---------------- */
function safeUrl(u){
  u=String(u||'').trim(); if(!u) return null;
  if(/^https:\/\//i.test(u)) return u;
  if(/^[\w][\w\-\/. %]*$/.test(u)) return u;      // archivo dentro del repositorio
  return null;
}
const ytId = u=>{const m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/))([\w-]{11})/);return m?m[1]:null};
function mediaEl(u){
  const id=ytId(u);
  if(id) return `<div class="media"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1" allow="encrypted-media; picture-in-picture" allowfullscreen title="Técnica del ejercicio"></iframe></div>
    <a class="btn" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener noreferrer">Abrir en YouTube</a>`;
  if(/\.(mp4|webm|mov)(\?|#|$)/i.test(u)) return `<div class="media"><video src="${esc(u)}" autoplay loop muted playsinline controls></video></div>`;
  if(/\.(gif|png|jpe?g|webp|avif|svg)(\?|#|$)/i.test(u)) return `<div class="media"><img src="${esc(u)}" alt="Demostración del ejercicio"></div>`;
  return `<a class="btn gold" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Abrir enlace de la técnica</a>`;
}
let EX = {};
function closeTech(){
  document.querySelectorAll('.tech-panel.open').forEach(p=>{ p.classList.remove('open'); p.innerHTML=''; });
  document.querySelectorAll('.tech[aria-expanded=true]').forEach(b=>{ b.setAttribute('aria-expanded','false'); b.textContent='▶ ¿No sabes cómo hacerlo?'; });
}
function toggleTech(id){
  const card=document.querySelector(`.ex[data-id="${id}"]`), it=EX[id]; if(!card||!it||!it.media) return;
  const btn=card.querySelector('.tech'), panel=card.querySelector('.tech-panel'), wasOpen=panel.classList.contains('open');
  closeTech(); if(wasOpen) return;
  panel.innerHTML=`${it.tec?`<p class="tec">${esc(it.tec)}</p>`:''}${mediaEl(it.media)}`;
  panel.classList.add('open'); btn.setAttribute('aria-expanded','true'); btn.textContent='▲ Ocultar ejercicio';
  setTimeout(()=>{ const r=panel.getBoundingClientRect(); if(r.bottom>innerHeight-70) window.scrollBy({top:r.bottom-innerHeight+90,behavior:'smooth'}); },60);
}

function renderTabs(){
  const f=dateOf(1), l=dateOf(7);
  $('weeklbl').textContent = `${f.getDate()} ${MONTHS[f.getMonth()]} – ${l.getDate()} ${MONTHS[l.getMonth()]}`;
  $('tabs').innerHTML = DAYS.map((nm,i)=>{
    const d=i+1, st=dayStats(d), future=d>todayNum, full=st.t>0&&st.pct===100;
    const ring = full ? `<div class="ring full"><span>✓</span></div>` : `<div class="ring" style="--p:${st.pct}"><span></span></div>`;
    return `<button class="tab ${d===selDay?'on':''} ${d===todayNum?'today':''} ${future?'future':''}" data-d="${d}" aria-label="${DAYS_LONG[i]} ${dateOf(d).getDate()}${full?', completo':''}">${nm}<strong>${dateOf(d).getDate()}</strong>${ring}</button>`;
  }).join('');
  $('tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    selDay=+t.dataset.d; render();

    if(window.scrollY>top) window.scrollTo({top,behavior:'smooth'});

function exHTML(id,e,n){
  const s=EX[id].s, tools=`${e.nota?`<span class="note">${esc(e.nota)}</span>`:''}${EX[id].media?`<button class="tech" data-id="${id}" aria-expanded="false">▶ ¿No sabes cómo hacerlo?</button>`:''}`;
  return `<div class="ex ${n>=s?'complete':''}" data-id="${id}">
    <div class="ex-top"><div class="ex-n">${esc(e.n)}</div>
      <div class="reps">${esc(e.reps)}<small>reps · ${s} series</small></div></div>
    ${tools?`<div class="ex-tools">${tools}</div>`:''}
    ${EX[id].media?'<div class="tech-panel"></div>':''}
    <div class="dots">${Array.from({length:s},(_,k)=>{const on=k<n; return `<button class="dot ${on?'on':''}" data-id="${id}" data-k="${k}" aria-pressed="${on}" aria-label="Serie ${k+1}${on?' completada':''}">${k+1}</button>`}).join('')}</div>
  </div>`;
}

function renderDay(){
  const bl = bloquesDelDia(selDay), P = getP(selDay), st = dayStats(selDay);
  const date=dateOf(selDay), isToday = selDay===todayNum;
  EX = {}; closeTech(); let html='';

  if(selDay===7) html += `<div class="cta-week"><b>Cierra tu semana</b><p>Mira cuánto lograste, qué te faltó y llévate tu frase para arrancar el lunes.</p><button class="btn gold" id="ctaWeek">Ver resumen de la semana</button></div>`;

  const titulo = bl.length ? bl.map(x=>x.b.titulo).join(' + ') : 'Descanso activo';
  html += `<div class="dayhead"><h2>${esc(titulo)}</h2>
    <small>${DAYS_LONG[selDay-1]} ${date.getDate()}${isToday?' · HOY':''}</small>
    ${st.t?`<div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${st.pct}" aria-label="Avance del día"><i id="barFill" style="width:${st.pct}%"></i></div>
      <div class="barlbl"><span id="barTxt">${st.d} de ${st.t} series</span><b id="barPct">${st.pct}%</b></div>`:''}</div>`;

  if(!bl.length) html += `<div class="rest"><b>Sin pesas hoy</b>Día de recuperación. Si te toca cardio, márcalo abajo.</div>`;

  bl.forEach(({b,bi})=>b.circuitos.forEach((c,ci)=>{
    let cd=0, ct=0;
    c.ejercicios.forEach((e,ei)=>{const id=`${bi}-${ci}-${ei}`,s=Math.max(1,parseInt(e.series)||1);
      EX[id]={n:e.n,s,media:safeUrl(e.media),tec:e.tec||'',nota:e.nota||''}; ct+=s; cd+=Math.min(+P[id]||0,s);});
    html += `<section class="circ" data-ids="${c.ejercicios.map((_,ei)=>`${bi}-${ci}-${ei}`).join(',')}"><div class="circ-h"><span>${esc(c.nombre)}</span><em class="cnt">${cd}/${ct} series</em></div>`;
    c.ejercicios.forEach((e,ei)=>{ const id=`${bi}-${ci}-${ei}`; html += exHTML(id,e,+P[id]||0); });
    html += `</section>`;
  }));

  if(R.cardio&&R.cardio.length){
    html += `<section class="circ cardio"><div class="circ-h"><span>Cardiovascular</span><em>Diario</em></div>`;
    R.cardio.forEach((c,i)=>{
      const id=`c-${i}`, on=(+P[id]||0)>0;
      EX[id]={n:c.n,s:1};
      html += `<div class="ex ${on?'complete':''}" data-id="${id}"><div class="ex-top"><div class="ex-n">${esc(c.n)}</div>
        <div class="reps">${esc(c.tiempo)}<small>diario</small></div></div>
        ${c.nota?`<div class="ex-tools"><span class="note">${esc(c.nota)}</span></div>`:''}
        <div class="dots"><button class="dot ${on?'on':''}" data-id="${id}" data-k="0" aria-pressed="${on}" aria-label="Cardio completado">✓</button></div></div>`;
    });
    html += `</section>`;
  }

  html += `<div class="actions">
    <button class="btn gold" id="btnDay">Terminar este día</button>
    <button class="btn out" id="btnWeek">Resumen de la semana</button>
    <button class="btn" id="btnPdf">⬇ Descargar rutina en PDF</button>
    <button class="btn ghost" id="reset">Reiniciar este día</button></div>`;
  $('day').innerHTML = html;

  $('day').querySelectorAll('.dot').forEach(b=>b.onclick=()=>toggleSet(b.dataset.id,+b.dataset.k));
  $('day').querySelectorAll('.tech').forEach(b=>b.onclick=()=>toggleTech(b.dataset.id));
  $('btnDay').onclick=()=>openReview('day');
  $('btnWeek').onclick=()=>openReview('week');
  $('btnPdf').onclick=printPdf;
  const cw=$('ctaWeek'); if(cw) cw.onclick=()=>openReview('week');
  $('reset').onclick=()=>{ if(confirm(`¿Reiniciar el progreso del ${DAYS_LONG[selDay-1].toLowerCase()}?`)){setP(selDay,{});render()} };
}
function render(){ renderHeader(); renderTabs(); renderDay(); }
/* Actualiza solo lo que cambió (no reconstruye la pantalla, así el video abierto no se reinicia) */
function refreshDay(){
  const P=getP(selDay);
  document.querySelectorAll('#day .ex').forEach(card=>{
    const id=card.dataset.id, it=EX[id]; if(!it) return; const n=Math.min(+P[id]||0,it.s);
    card.classList.toggle('complete',n>=it.s);
    card.querySelectorAll('.dot').forEach((d,k)=>{ const on=k<n; d.classList.toggle('on',on); d.setAttribute('aria-pressed',on);
      d.setAttribute('aria-label',it.cardio?'Cardio completado':`Serie ${k+1}${on?' completada':''}`); });
  });
  document.querySelectorAll('#day .circ[data-ids]').forEach(sec=>{
    let cd=0,ct=0; sec.dataset.ids.split(',').forEach(id=>{const it=EX[id]; if(it){ct+=it.s; cd+=Math.min(+P[id]||0,it.s);}});
    sec.querySelector('.cnt').textContent=`${cd}/${ct} series`;
  });
  const st=dayStats(selDay);
  if($('barFill')){ $('barFill').style.width=st.pct+'%'; $('barTxt').textContent=`${st.d} de ${st.t} series`; $('barPct').textContent=st.pct+'%'; $('bar').setAttribute('aria-valuenow',st.pct); }
  renderTabs();
}

function toggleSet(id,k){
  const it=EX[id]; if(!it) return;
  const date=dateOf(selDay), P=getP(selDay), before=statsOf(date).pct, cur=+P[id]||0;
  P[id] = (cur===k+1)?k:k+1; setP(selDay,P);
  const after=statsOf(date).pct;
  buzz(10); refreshDay();
  if(after===100&&before<100) toast('¡Día completo! Así se hace, campeón 🔥');
}

/* ---------------- Frase del resumen ---------------- */
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function frasePick(seed){
  const g=generoOf(), pal=THEMES[TEMA].frases;
  const lista=FR.lista.filter(f=>!f[2]||f[2]===g), h=hash(seed);
  const f=lista[h%lista.length], c=pal[Math.floor(h/7)%pal.length];
  return {src:`${FRASES_BASE}${f[0]}/${f[0]}-${c}.png`,alt:f[1]};
}
const PHRASES = {
  full:["Eso no es suerte, es disciplina. Cada serie que terminaste te acerca a la versión de ti que quieres ver.","Cumpliste con todo. Los campeones no esperan motivación: se presentan, y tú te presentaste."],
  high:["Estás a un paso de la perfección. Los campeones se hacen en los detalles: la próxima vez ve por ese 100%.","Muy sólido. Lo que falta es pequeño, y lo que construiste es grande. Ajusta y sigue."],
  mid:["Ya pasaste la mitad, y eso es constancia. Lo que te faltó no es un fracaso, es tu siguiente reto.","Cada serie cuenta. Lo que no se hizo se puede retomar: lo importante es que no pares."],
  low:["Empezar es lo más difícil, y ya lo hiciste. No busques perfección, busca volver: una serie más que ayer ya es progreso.","El avance no siempre se ve igual. Pero cada vez que llegas, estás votando por la persona que quieres ser."],
  zero:["Aquí todavía no hay nada marcado, y está bien. El mejor momento para arrancar es ahora: una serie, solo una.","No importa cómo empezó. Importa cómo sigues. Hoy puede ser el primer día de tu mejor racha."]
};
const lc = s=>s.charAt(0).toLowerCase()+s.slice(1);
const phraseFor = (p,seed)=>{const a=p===100?PHRASES.full:p>=80?PHRASES.high:p>=50?PHRASES.mid:p>0?PHRASES.low:PHRASES.zero;return a[hash(seed+'t')%a.length]};
const missLine = it=>it.done>0 ? `${esc(it.n)} <span>· ${it.done} de ${it.s} series</span>` : `${esc(it.n)}`;

function openReview(scope){
  const days = scope==='day' ? [selDay] : Array.from({length:todayNum},(_,i)=>i+1);
  let T_=0,D=0, miss='';
  days.forEach(n=>{
    const st=dayStats(n); T_+=st.t; D+=st.d;
    if(!st.miss.length) return;
    const tit = bloquesDelDia(n).map(x=>x.b.titulo).join(' + ') || 'Descanso activo';
    let body;
    if(st.d===0 && scope==='week') body = `<ul><li>${esc(tit)} <span>· sin registro</span></li></ul>`;
    else{
      const shown=st.miss.slice(0,6), more=st.miss.length-shown.length;
      body = `<ul>${shown.map(it=>`<li>${missLine(it)}</li>`).join('')}${more>0?`<li><span>y ${more} más…</span></li>`:''}</ul>`;
    }
    miss += `<h4>${DAYS_LONG[n-1]}</h4>${body}`;
  });
  const pct = T_?Math.round(D/T_*100):0;
  const title = scope==='day' ? `Tu ${DAYS_LONG[selDay-1].toLowerCase()}` : (todayNum===7?'Tu semana completa':'Tu semana hasta hoy');
  const verb = pct===100?'¡Lo completaste todo!':`Completaste el ${pct}%`;
  const seed=`${USER}|${scope}|${ymd(scope==='day'?dateOf(selDay):monday)}`, fr=frasePick(seed);

  $('rv').innerHTML = `
    <div class="rv-top">
      <div class="rv-ring" style="--p:${pct}"><div><b>${pct}%</b><small>${D} de ${T_} series</small></div></div>
      <h3 class="rv-title">${verb}</h3><p class="rv-sub">${title}</p>
    </div>
    <div class="rv-phrase"><img src="${esc(fr.src)}" alt="${esc(fr.alt)}" onerror="this.remove()"><p>${esc(firstName())}, ${esc(lc(phraseFor(pct,seed)))}</p></div>
    <div class="rv-miss">${pct===100?'<div class="rv-ok">No te faltó nada. Excelente trabajo.</div>':`<h4 style="margin-top:0">¿Qué te faltó?</h4>${miss||'<ul><li><span>Nada pendiente en lo registrado.</span></li></ul>'}`}</div>`;
  openModal('rvmodal');
}

/* ---------------- Mi progreso ---------------- */
function weekPct(mon){
  let t=0,d=0;
  for(let i=0;i<7;i++){ const dt=new Date(mon); dt.setDate(mon.getDate()+i); if(dt>startOfToday) break; const st=statsOf(dt); t+=st.t; d+=st.d; }
  return {pct:t?Math.round(d/t*100):0,t,d};
}
function allDates(){
  const pre=`ca3:${USER}:`, out=[];
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(k&&k.startsWith(pre)&&/^\d{4}-\d{2}-\d{2}$/.test(k.slice(pre.length))){ const [y,m,d]=k.slice(pre.length).split('-').map(Number); out.push(new Date(y,m-1,d)); } } }catch(e){}
  return out.sort((a,b)=>a-b);
}
function openProgress(){
  const dates=allDates(); let series=0, full=0;
  dates.forEach(dt=>{ const st=statsOf(dt); series+=st.d; if(st.t&&st.pct===100) full++; });
  // racha: días seguidos al 100% (si hoy aún no está completo, cuenta desde ayer)
  let streak=0; const c=new Date(startOfToday);
  if(!(statsOf(c).t&&statsOf(c).pct===100)) c.setDate(c.getDate()-1);
  while(true){ const st=statsOf(c); if(st.t&&st.pct===100){streak++;c.setDate(c.getDate()-1)} else break; if(streak>3650) break; }

  const wk=weekPct(monday);
  const firstMon=dates.length?(()=>{const d=new Date(dates[0]);d.setDate(d.getDate()-(wdOf(d)-1));return d})():monday;
  const weeks=[]; for(let i=7;i>=0;i--){ const m=new Date(monday); m.setDate(monday.getDate()-7*i); if(m<firstMon) continue; weeks.push({m,p:weekPct(m).pct}); }
  const bars=weeks.map(w=>`<div class="wk-col"><span class="wk-v">${w.p}%</span><div class="wk-bar" style="height:${Math.max(2,w.p)}%"></div><span class="wk-l">${w.m.getDate()}/${pad(w.m.getMonth()+1)}</span></div>`).join('');

  $('pg').innerHTML=`
    <h3 class="rv-title" style="text-align:left">Mi progreso</h3>
    <div class="rv-top"><div class="rv-ring" style="--p:${wk.pct}"><div><b>${wk.pct}%</b><small>${wk.d} de ${wk.t} series</small></div></div>
      <p class="rv-sub">Esta semana, hasta hoy</p></div>
    <div class="tiles">
      <div><b>${series.toLocaleString('es-MX')}</b><small>series hechas</small></div>
      <div><b>${full}</b><small>${full===1?'día completo':'días completos'}</small></div>
      <div><b>${streak} 🔥</b><small>${streak===1?'día de racha':'días de racha'}</small></div>
    </div>
    ${dates.length?`<h4 class="pg-h">Constancia semanal</h4>
    <div class="wk" role="img" aria-label="Porcentaje de series completadas por semana">${bars}</div>
    <p class="pg-note">% de series completadas contra tu plan, incluido el cardio diario.</p>`
    :'<p>Aún no hay registros. Marca tu primera serie y aquí verás tu constancia y tu racha.</p>'}`;
  openModal('pgmodal');
}

/* ---------------- PDF (imprimir → guardar como PDF) ---------------- */
function listaDias(a){
  const n=a.map(d=>DAYS_LONG[d-1]);
  if(a.length===7) return 'Todos los días';
  return n.length<2?n.join(''):n.slice(0,-1).join(', ')+' y '+n[n.length-1];
}
function printPdf(){
  const box=(s)=>Array.from({length:s},()=>'<span class="pd-box"></span>').join('');
  let h=`<div class="pd-head"><img alt="" src="${esc($('logoimg').src)}"><div><h1>${esc(R.cliente||'')}</h1><p>${esc(R.programa||'')}</p></div></div>`;
  h+=`<div class="pd-meta">${R.tipo?`<span>Programación: <b>${esc(R.tipo)}</b></span>`:''}${R.diasEfectivos?`<span>Días efectivos: <b>${esc(R.diasEfectivos)}</b> por semana</span>`:''}</div>`;
  if(R.objetivos&&R.objetivos.length) h+=`<div class="pd-obj"><b>Objetivos:</b> ${R.objetivos.map(esc).join(' · ')}</div>`;
  R.bloques.forEach(b=>{
    h+=`<section class="pd-block"><h2>${esc(b.titulo)}</h2><p class="pd-days">${esc(listaDias(b.dias))}</p>`;
    b.circuitos.forEach(c=>{
      h+=`<table class="pd"><caption>${esc(c.nombre)}</caption><thead><tr><th>Ejercicio</th><th>Reps</th><th>Series</th><th>Indicaciones</th><th>Seguimiento</th></tr></thead><tbody>`;
      c.ejercicios.forEach(e=>{ const s=Math.max(1,parseInt(e.series)||1);
        h+=`<tr><td class="n">${esc(e.n)}</td><td class="c">${esc(e.reps)}</td><td class="c">${s}</td><td class="i">${esc(e.nota||'')}</td><td class="c">${box(s)}</td></tr>`; });
      h+=`</tbody></table>`;
    });
    h+=`</section>`;
  });
  if(R.cardio&&R.cardio.length){
    h+=`<section class="pd-block"><h2>Cardiovascular</h2><p class="pd-days">Todos los días</p><table class="pd"><thead><tr><th>Actividad</th><th>Tiempo</th><th></th><th>Indicaciones</th><th>Seguimiento</th></tr></thead><tbody>`;
    R.cardio.forEach(c=>{ h+=`<tr><td class="n">${esc(c.n)}</td><td class="c">${esc(c.tiempo)}</td><td></td><td class="i">${esc(c.nota||'')}</td><td class="c">${box(1)}</td></tr>`; });
    h+=`</tbody></table></section>`;
  }
  h+=`<div class="pd-foot">Be a Champion!<small>Champion Academy MBS</small></div>`;
  $('printDoc').innerHTML=h;
  const old=document.title; document.title=`Rutina ${R.cliente||''} - Champion Academy`.trim();
  const back=()=>{document.title=old;window.removeEventListener('afterprint',back)};
  window.addEventListener('afterprint',back);
  setTimeout(()=>window.print(),60);
}

/* ---------------- Modales ---------------- */
function openModal(id){ $(id).classList.add('open'); }
function closeModal(m){ m.classList.remove('open'); }
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) closeModal(m); }));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.modal.open').forEach(closeModal); });
$('rvClose').onclick=()=>closeModal($('rvmodal'));
$('pgClose').onclick=()=>closeModal($('pgmodal'));
$('fabProg').onclick=openProgress;

/* ---------------- Inicio ---------------- */
document.querySelector('meta[name="theme-color"]').setAttribute('content','#0c0c0e');
render();
</script>
