<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Champion Academy · Rutina</title>
<style>
:root{
  --bg:#0c0c0e; --bg2:#151518; --card:#1a1a1e; --line:#2a2a30;
  --gold:#e8b923; --gold2:#f6d86a; --gold-dim:#8a6f14;
  --text:#f4f4f5; --muted:#9a9aa3; --ok:#3ecf8e; --ok-soft:#3ecf8e14;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;
  background-image:radial-gradient(circle at 1px 1px,#222226 1px,transparent 0);background-size:14px 14px;
  min-height:100vh;min-height:100dvh;padding-bottom:calc(36px + env(safe-area-inset-bottom));overflow-x:hidden}
body:has(.modal.open){overflow:hidden}
button{font:inherit;touch-action:manipulation}
button:focus-visible,label:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}

/* ---------- Header ---------- */
header.hero{padding:calc(24px + env(safe-area-inset-top)) 16px 14px;text-align:center;position:relative;overflow:hidden}
header.hero::before,header.hero::after{content:"";position:absolute;width:64px;height:64px;border-top:3px solid var(--gold);border-left:3px solid var(--gold);opacity:.8;box-shadow:-4px -4px 14px #e8b92340}
header.hero::before{left:-34px;top:70px;transform:rotate(-45deg)}
header.hero::after{right:-34px;top:70px;transform:rotate(135deg)}
.logo{width:min(150px,42vw);margin:0 auto 8px}
.logo img{display:block;width:100%;height:auto}
.hero h1{margin:8px 0 2px;font-size:clamp(1.35rem,6vw,1.75rem);font-weight:800;color:var(--gold2)}
.hero .sub{color:var(--muted);font-size:.9rem}

.meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 14px}
.pill{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.78rem;color:var(--muted);text-align:center}
.pill b{color:var(--gold)}

.obj{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.obj h3{margin:0 0 6px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.obj ul{margin:0;padding-left:18px;font-size:.9rem}

/* ---------- Semana ---------- */
.week{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)*0) 0 10px;margin-top:-2px;box-shadow:0 10px 12px -10px #000}
.week-t{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px;display:flex;justify-content:space-between;gap:8px}
.week-in{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.tab{background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:7px 0 8px;text-align:center;cursor:pointer;font-size:.66rem;position:relative;min-height:62px}
.tab strong{display:block;font-size:1rem;color:var(--text);margin-top:1px}
.tab.on{background:var(--gold);border-color:var(--gold);color:#201a00}
.tab.on strong{color:#201a00}
.tab.today::after{content:"HOY";position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--bg);color:var(--gold);border:1px solid var(--gold);font-size:.5rem;font-weight:800;letter-spacing:.06em;padding:0 5px;border-radius:99px;line-height:1.5}
.ring{--p:0;width:22px;height:22px;border-radius:50%;margin:5px auto 0;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#34343b 0)}
.ring span{width:14px;height:14px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.tab.on .ring{background:conic-gradient(#201a00 calc(var(--p)*1%),#00000030 0)}
.tab.on .ring span{background:var(--gold)}
.ring.full{background:var(--gold)}
.ring.full span{background:var(--gold);color:#201a00;font-size:.7rem;font-weight:900}
.tab.on .ring.full{background:#201a00}
.tab.on .ring.full span{background:#201a00;color:var(--gold2)}
.tab.future .ring{opacity:.4}

/* ---------- Día ---------- */
.dayhead{margin:14px 0 14px}
.dayhead h2{margin:0;font-size:1.2rem;line-height:1.25;overflow-wrap:anywhere}
.dayhead small{display:inline-block;color:var(--gold);background:#2a2410;font-weight:700;font-size:.72rem;border-radius:99px;padding:2px 10px;margin-top:6px}
.bar{height:10px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold2));border-radius:99px;transition:width .35s}
.barlbl{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:6px}
.barlbl b{color:var(--gold2)}

.circ{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.circ-h{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#201a00;font-weight:800;padding:9px 16px;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.circ-h em{font-style:normal;font-weight:700;font-size:.72rem;background:#00000018;border-radius:99px;padding:2px 9px;letter-spacing:.02em;text-transform:none;white-space:nowrap}
.ex{padding:14px 16px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-n{font-weight:650;font-size:1rem;min-width:0;overflow-wrap:anywhere}
.reps{flex:none;text-align:right;color:var(--gold);font-weight:800;font-size:.95rem;white-space:nowrap}
.reps small{display:block;color:var(--muted);font-weight:500;font-size:.64rem;text-transform:uppercase;letter-spacing:.06em}
.note{margin-top:6px;font-size:.8rem;color:var(--gold2);background:#2a2410;border-left:3px solid var(--gold);padding:4px 8px;border-radius:0 6px 6px 0;display:inline-block}
.dots{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg2);color:var(--muted);font-weight:700;cursor:pointer;transition:.15s;user-select:none;-webkit-user-select:none}
.dot.on{background:var(--gold);border-color:var(--gold);color:#201a00;transform:scale(1.05)}
.ex.complete{background:var(--ok-soft)}
.ex.complete .ex-n{color:var(--ok)}
.ex.complete .ex-n::after{content:" ✓"}

.cardio{border-color:var(--gold-dim)}
.cardio .circ-h{background:var(--bg2);color:var(--gold);border-bottom:1px solid var(--gold-dim)}
.cardio .circ-h em{background:#ffffff14}

.rest{text-align:center;padding:24px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px;margin-bottom:14px}
.rest b{display:block;font-size:1.1rem;color:var(--text);margin-bottom:4px}

.cta-week{background:linear-gradient(160deg,#2a2410,var(--card));border:1px solid var(--gold-dim);border-radius:16px;padding:16px;margin-bottom:14px;text-align:center}
.cta-week b{color:var(--gold2);display:block;font-size:1.05rem;margin-bottom:4px}
.cta-week p{margin:0 0 12px;color:#cfcfd2;font-size:.85rem}

.actions{display:grid;gap:10px;margin-top:6px}
.btn{display:block;width:100%;min-height:48px;text-align:center;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px;font-weight:700;cursor:pointer}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#201a00}
.btn.out{background:none;border-color:var(--gold);color:var(--gold2)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:600;font-size:.82rem}
.slogan{text-align:center;font-style:italic;font-weight:900;font-size:1.6rem;color:var(--gold);margin:26px 0 8px}

/* ---------- Modales ---------- */
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:30;overscroll-behavior:contain}
.modal.open{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain}
.sheet h3{margin:0 0 4px}
.sheet p{color:var(--muted);font-size:.85rem;margin:4px 0 14px}
.sheet .btn{margin-bottom:10px}
.msg{font-size:.82rem;margin-top:6px}
.msg.err{color:#ff7a7a}.msg.ok{color:var(--ok)}
code{background:var(--bg2);padding:1px 5px;border-radius:5px;font-size:.8rem}

.rv-top{text-align:center}
.rv-ring{--p:0;width:132px;height:132px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#2a2a30 0)}
.rv-ring div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;align-content:center}
.rv-ring b{font-size:2rem;line-height:1;color:var(--gold2)}
.rv-ring small{color:var(--muted);font-size:.7rem}
.rv-title{margin:0;font-size:1.15rem}
.rv-sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.rv-phrase{background:#2a2410;color:#fff;border-radius:16px;padding:16px;margin:14px 0;text-align:center;font-size:.98rem;border-bottom:4px solid var(--gold)}
.rv-phrase b{display:block;margin-top:8px;color:var(--gold2);font-style:italic}
.rv-miss h4{margin:12px 0 4px;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.rv-miss ul{margin:0 0 4px;padding-left:18px;font-size:.88rem}
.rv-miss li{margin:2px 0;overflow-wrap:anywhere}
.rv-miss li span{color:var(--muted)}
.rv-ok{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.9rem;text-align:center}

@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
@media(max-width:359px){
  .tab{font-size:.6rem;min-height:58px}.tab strong{font-size:.92rem}
  .ring{width:20px;height:20px}.ring span{width:12px;height:12px}
  .reps{font-size:.85rem}.dots{gap:6px}
  .circ-h{font-size:.75rem;padding:8px 12px}.ex{padding:12px}
}
@media(max-height:520px) and (orientation:landscape){.week{position:static;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.fab,.week,.actions,.cta-week{display:none}body{background:#fff;color:#000}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ============================================================
   DATOS POR DEFECTO (rutina de Alfredo Castillo)
   Para otra persona: carga un Excel desde "⚙ Rutina" o publica
   un JSON en rutinas/<nombre>.json y abre index.html?u=<nombre>
   ============================================================ */
const DEFAULT = {
  cliente: "Alfredo Castillo",
  programa: "Extremidades superiores / Piernas / Tronco",
  tipo: "Hombro, bíceps y tríceps; piernas; pecho y espalda",
  diasEfectivos: 6,
  objetivos: ["Incremento de resistencia muscular", "Disminución de % de grasa corporal"],
  bloques: [
    { titulo: "Hombros / Bíceps / Tríceps", dias: [1,3,5], circuitos: [
      { nombre: "Circuito 1", ejercicios: [
        { n: "Press de hombro c/mancuerna", reps: "10 a 12", series: 4, nota: "" },
        { n: "Elevaciones laterales con cable", reps: "12 a 15", series: 4, nota: "" },
        { n: "Pájaros sobre banco inclinado a 45°", reps: "12 a 15", series: 4, nota: "" } ]},
      { nombre: "Circuito 3", ejercicios: [
        { n: "Curl c/barra Z", reps: "10 a 12", series: 4, nota: "" },
        { n: "Curl c/mancuerna sentado", reps: "12 a 15", series: 4, nota: "Banco inclinado 30°" },
        { n: "Curl martillo simultáneo", reps: "12 a 15", series: 4, nota: "Mantener contracción 1s" } ]},
      { nombre: "Circuito 4", ejercicios: [
        { n: "Copa a dos manos c/mancuerna", reps: "10 a 12", series: 4, nota: "" },
        { n: "Press francés barra Z", reps: "12 a 15", series: 4, nota: "Banco inclinado 60°" },
        { n: "Extensión de tríceps c/cuerda", reps: "12 a 15", series: 4, nota: "" } ]}
    ]},
    { titulo: "Cuádriceps / Femorales / Glúteos y Gemelos", dias: [2,6], circuitos: [
      { nombre: "Circuito 1", ejercicios: [
        { n: "Sentadilla hack", reps: "10 a 12", series: 4, nota: "Posición neutra" },
        { n: "Leg extensión", reps: "12 a 15", series: 4, nota: "" },
        { n: "Leg curl boca abajo", reps: "12 a 15", series: 4, nota: "" } ]},
      { nombre: "Circuito 2", ejercicios: [
        { n: "Prensa", reps: "12 a 15", series: 4, nota: "Posición neutra" },
        { n: "Leg curl en silla", reps: "12 a 15", series: 4, nota: "" },
        { n: "Desplantes en máquina smith", reps: "10 a 12", series: 4, nota: "" } ]},
      { nombre: "Circuito 4", ejercicios: [
        { n: "Máquina de abducción", reps: "12 a 15", series: 4, nota: "" },
        { n: "Máquina de aducción", reps: "12 a 15", series: 4, nota: "" },
        { n: "Elevación de talones parado", reps: "15 a 20", series: 4, nota: "Cuidar alineación espalda" } ]}
    ]},
    { titulo: "Espalda / Pecho", dias: [4], circuitos: [
      { nombre: "Circuito 1", ejercicios: [
        { n: "Jalón al frente", reps: "12 a 15", series: 4, nota: "Agarre prono" },
        { n: "Remo sentado con triángulo", reps: "12 a 15", series: 4, nota: "Agarre neutro" },
        { n: "Pulldown c/cuerda", reps: "12 a 15", series: 4, nota: "" } ]},
      { nombre: "Circuito 3", ejercicios: [
        { n: "Press c/mancuerna en banco inclinado", reps: "12 a 15", series: 4, nota: "" },
        { n: "Fondos con agarre abierto", reps: "12 a 15", series: 4, nota: "" },
        { n: "Cristos c/mancuerna en banco horizontal", reps: "12 a 15", series: 4, nota: "" } ]}
    ]}
  ],
  cardio: [ { n: "Caminadora o elíptica o escalera", tiempo: "45 min.", nota: "Mantener ritmo medio" } ]
};

/* ---------------- Estado y fechas ---------------- */
let R = DEFAULT;
const params = new URLSearchParams(location.search);
const USER = params.get('u') || 'default';
const DAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DAYS_LONG = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const $ = id=>document.getElementById(id);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n=>String(n).padStart(2,'0');
const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const startOfToday = (()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const todayNum = ((startOfToday.getDay()+6)%7)+1;          // Lun=1 … Dom=7
const monday = (()=>{const d=new Date(startOfToday);d.setDate(d.getDate()-(todayNum-1));return d})();
const dateOf = n=>{const d=new Date(monday);d.setDate(monday.getDate()+n-1);return d};
let selDay = todayNum;

/* Progreso: una entrada por usuario + fecha real de cada día de la semana.
   Así lo que marcas el lunes no aparece marcado el miércoles. */
const pKey = n=>`ca:${USER}:${ymd(dateOf(n))}`;
const getP = n=>{try{return JSON.parse(localStorage.getItem(pKey(n))||'{}')}catch(e){return {}}};
const setP = (n,p)=>{try{localStorage.setItem(pKey(n),JSON.stringify(p))}catch(e){}};

/* ---------------- Cálculos ---------------- */
function bloquesDelDia(d){ return R.bloques.map((b,bi)=>({b,bi})).filter(x=>x.b.dias.includes(d)); }

function dayItems(n){
  const items=[];
  bloquesDelDia(n).forEach(({b,bi})=>b.circuitos.forEach((c,ci)=>c.ejercicios.forEach((e,ei)=>
    items.push({id:`${bi}-${ci}-${ei}`,n:e.n,s:Math.max(1,parseInt(e.series)||1)}))));
  (R.cardio||[]).forEach((c,i)=>items.push({id:`c-${i}`,n:`${c.n}${c.tiempo?` (${c.tiempo})`:''}`,s:1,cardio:true}));
  return items;
}
function dayStats(n){
  const P=getP(n), items=dayItems(n); let t=0,d=0; const miss=[];
  items.forEach(it=>{ const k=Math.min(P[it.id]||0,it.s); t+=it.s; d+=k; if(k<it.s) miss.push({...it,done:k}); });
  return {t,d,pct:t?Math.round(d/t*100):0,miss};
}
const firstName = ()=>String(R.cliente||'').trim().split(/\s+/)[0]||'campeón';

/* ---------------- Render ---------------- */
function renderHeader(){
  $('cliente').textContent = R.cliente||'Programa de entrenamiento';
  $('tipo').textContent = R.programa||'';
  $('meta').innerHTML =
    (R.tipo?`<span class="pill">Programación: <b>${esc(R.tipo)}</b></span>`:'')+
    (R.diasEfectivos?`<span class="pill">Días efectivos: <b>${esc(R.diasEfectivos)}</b>/semana</span>`:'');
  $('obj').innerHTML = (R.objetivos&&R.objetivos.length)
    ? `<h3>Objetivos</h3><ul>${R.objetivos.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>` : '';
  $('obj').style.display = (R.objetivos&&R.objetivos.length)?'block':'none';
  document.title = `Champion Academy · ${R.cliente||'Rutina'}`;
}

function renderTabs(){
  const f=dateOf(1), l=dateOf(7), m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  $('weeklbl').textContent = `${f.getDate()} ${m[f.getMonth()]} – ${l.getDate()} ${m[l.getMonth()]}`;
  $('tabs').innerHTML = DAYS.map((nm,i)=>{
    const d=i+1, st=dayStats(d), future=d>todayNum, full=st.t>0&&st.pct===100;
    const ring = full ? `<div class="ring full"><span>✓</span></div>`
                      : `<div class="ring" style="--p:${st.pct}"><span>${st.pct>0?'':''}</span></div>`;
    return `<button class="tab ${d===selDay?'on':''} ${d===todayNum?'today':''} ${future?'future':''}" data-d="${d}" aria-label="${DAYS_LONG[i]}">${nm}<strong>${dateOf(d).getDate()}</strong>${ring}</button>`;
  }).join('');
  $('tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{selDay=+t.dataset.d;render();const wk=document.querySelector('.week'),top=$('day').getBoundingClientRect().top+window.scrollY-wk.offsetHeight-8;if(window.scrollY>top)window.scrollTo({top,behavior:'smooth'})});
}

function renderDay(){
  const bl = bloquesDelDia(selDay), P = getP(selDay), st = dayStats(selDay);
  let html='';
  const isToday = selDay===todayNum;

  if(selDay===7){
    html += `<div class="cta-week"><b>Cierra tu semana</b><p>Mira cuánto lograste, qué te faltó y llévate tu frase para arrancar el lunes.</p>
      <button class="btn gold" id="ctaWeek">Ver resumen de la semana</button></div>`;
  }

  const titulo = bl.length ? bl.map(x=>x.b.titulo).join(' + ') : 'Descanso activo';
  html += `<div class="dayhead"><h2>${esc(titulo)}</h2>
    <small>${DAYS_LONG[selDay-1]} ${dateOf(selDay).getDate()}${isToday?' · HOY':''}</small>
    ${st.t?`<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${st.pct}" aria-label="Avance del día"><i style="width:${st.pct}%"></i></div>
      <div class="barlbl"><span>${st.d} de ${st.t} series</span><b>${st.pct}%</b></div>`:''}</div>`;

  if(!bl.length){
    html += `<div class="rest"><b>Sin pesas hoy</b>Día de recuperación. Si te toca cardio, márcalo abajo.</div>`;
  }

  bl.forEach(({b,bi})=>b.circuitos.forEach((c,ci)=>{
    let cd=0, ct=0;
    c.ejercicios.forEach((e,ei)=>{const s=Math.max(1,parseInt(e.series)||1);ct+=s;cd+=Math.min(P[`${bi}-${ci}-${ei}`]||0,s)});
    html += `<section class="circ"><div class="circ-h"><span>${esc(c.nombre)}</span><em>${cd}/${ct} series</em></div>`;
    c.ejercicios.forEach((e,ei)=>{
      const id=`${bi}-${ci}-${ei}`, s=Math.max(1,parseInt(e.series)||1), n=P[id]||0;
      html += `<div class="ex ${n>=s?'complete':''}">
        <div class="ex-top"><div class="ex-n">${esc(e.n)}</div>
          <div class="reps">${esc(e.reps)}<small>reps · ${s} series</small></div></div>
        ${e.nota?`<div class="note">${esc(e.nota)}</div>`:''}
        <div class="dots">${Array.from({length:s},(_,k)=>`<button class="dot ${k<n?'on':''}" data-id="${id}" data-k="${k}" aria-label="Serie ${k+1}">${k+1}</button>`).join('')}</div>
      </div>`;
    });
    html += `</section>`;
  }));

  if(R.cardio&&R.cardio.length){
    html += `<section class="circ cardio"><div class="circ-h"><span>Cardiovascular</span><em>Diario</em></div>`;
    R.cardio.forEach((c,i)=>{
      const id=`c-${i}`, on=!!P[id];
      html += `<div class="ex ${on?'complete':''}"><div class="ex-top"><div class="ex-n">${esc(c.n)}</div>
        <div class="reps">${esc(c.tiempo)}<small>diario</small></div></div>
        ${c.nota?`<div class="note">${esc(c.nota)}</div>`:''}
        <div class="dots"><button class="dot ${on?'on':''}" data-id="${id}" data-k="0" aria-label="Completado">✓</button></div></div>`;
    });
    html += `</section>`;
  }

  html += `<div class="actions">
    <button class="btn gold" id="btnDay">Terminar este día</button>
    <button class="btn ${selDay===7?'out':''}" id="btnWeek">Resumen de la semana</button>
    <button class="btn ghost" id="reset">Reiniciar este día</button></div>`;
  $('day').innerHTML = html;

  $('day').querySelectorAll('.dot').forEach(b=>b.onclick=()=>{
    const P=getP(selDay), id=b.dataset.id, k=+b.dataset.k, cur=P[id]||0;
    P[id] = (cur===k+1)?k:k+1; setP(selDay,P); try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
    const y=window.scrollY; render(); window.scrollTo(0,y);
  });
  $('btnDay').onclick=()=>openReview('day');
  $('btnWeek').onclick=()=>openReview('week');
  const cw=$('ctaWeek'); if(cw) cw.onclick=()=>openReview('week');
  $('reset').onclick=()=>{ if(confirm(`¿Reiniciar el progreso del ${DAYS_LONG[selDay-1].toLowerCase()}?`)){setP(selDay,{});render()} };
}

function render(){ renderHeader(); renderTabs(); renderDay(); }

/* ---------------- Resumen + frase motivacional ---------------- */
const PHRASES = {
  full: [
    "Eso no es suerte, es disciplina. Cada serie que terminaste te acerca a la versión de ti que quieres ver.",
    "Cumpliste con todo. Los campeones no esperan motivación: se presentan, y tú te presentaste."
  ],
  high: [
    "Estás a un paso de la perfección. Los campeones se hacen en los detalles: la próxima vez ve por ese 100%.",
    "Muy sólido. Lo que falta es pequeño, y lo que construiste es grande. Ajusta y sigue."
  ],
  mid: [
    "Ya pasaste la mitad, y eso es constancia. Lo que te faltó no es un fracaso, es tu siguiente reto.",
    "Cada serie cuenta. Lo que no se hizo se puede retomar: lo importante es que no pares."
  ],
  low: [
    "Empezar es lo más difícil, y ya lo hiciste. No busques perfección, busca volver: una serie más que ayer ya es progreso.",
    "El avance no siempre se ve igual. Pero cada vez que llegas, estás votando por la persona que quieres ser."
  ],
  zero: [
    "Aquí todavía no hay nada marcado, y está bien. El mejor momento para arrancar es ahora: una serie, solo una.",
    "No importa cómo empezó. Importa cómo sigues. Hoy puede ser el primer día de tu mejor racha."
  ]
};
const lc = s=>s.charAt(0).toLowerCase()+s.slice(1);
const pick = a=>a[Math.floor(Math.random()*a.length)];
function phraseFor(p){ return pick(p===100?PHRASES.full:p>=80?PHRASES.high:p>=50?PHRASES.mid:p>0?PHRASES.low:PHRASES.zero); }

function missLine(it){
  return it.done>0 ? `${esc(it.n)} <span>· ${it.done} de ${it.s} series</span>` : `${esc(it.n)}`;
}

function openReview(scope){
  const days = scope==='day' ? [selDay] : Array.from({length:todayNum},(_,i)=>i+1);
  let T=0,D=0, miss='';
  days.forEach(n=>{
    const st=dayStats(n); T+=st.t; D+=st.d;
    if(!st.miss.length) return;
    const tit = bloquesDelDia(n).map(x=>x.b.titulo).join(' + ') || 'Descanso activo';
    let body;
    if(st.d===0 && scope==='week') body = `<ul><li>${esc(tit)} <span>· sin registro</span></li></ul>`;
    else{
      const shown=st.miss.slice(0,6), more=st.miss.length-shown.length;
      body = `<ul>${shown.map(it=>`<li>${missLine(it)}</li>`).join('')}${more>0?`<li><span>y ${more} más…</span></li>`:''}</ul>`;
    }
    miss += `<h4>${DAYS_LONG[n-1]}</h4>${body}`;
  });
  const pct = T?Math.round(D/T*100):0;
  const title = scope==='day' ? `Tu ${DAYS_LONG[selDay-1].toLowerCase()}` : (todayNum===7?'Tu semana completa':'Tu semana hasta hoy');
  const verb = pct===100?'¡Lo completaste todo!':`Completaste el ${pct}%`;

  $('rv').innerHTML = `
    <div class="rv-top">
      <div class="rv-ring" style="--p:${pct}"><div><b>${pct}%</b><small>${D} de ${T} series</small></div></div>
      <h3 class="rv-title">${verb}</h3>
      <p class="rv-sub">${title}</p>
    </div>
    <div class="rv-phrase">${esc(firstName())}, ${esc(lc(phraseFor(pct)))}<b>Be a Champion!</b></div>
    <div class="rv-miss">${pct===100?'<div class="rv-ok">No te faltó nada. Excelente trabajo.</div>':`<h4 style="margin-top:0">¿Qué te faltó?</h4>${miss||'<ul><li><span>Nada pendiente en lo registrado.</span></li></ul>'}`}</div>`;
  $('rvmodal').classList.add('open');
}
$('rvClose').onclick=()=>$('rvmodal').classList.remove('open');
$('rvmodal').onclick=e=>{if(e.target===$('rvmodal'))$('rvmodal').classList.remove('open')};

/* ---------------- Excel ⇄ Rutina ---------------- */
const norm = s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function parseDias(v){
  const t=norm(v); if(t.includes('diario')) return [1,2,3,4,5,6,7];
  return [...new Set((String(v).match(/[1-7]/g)||[]).map(Number))];
}

function excelToRutina(wb){
  const out = { cliente:'', programa:'', tipo:'', diasEfectivos:'', objetivos:[], bloques:[], cardio:[] };
  const sc = wb.SheetNames.find(n=>norm(n)==='cliente');
  if(sc){
    XLSX.utils.sheet_to_json(wb.Sheets[sc],{header:1,defval:''}).forEach(r=>{
      const k=norm(r[0]), v=String(r[1]??'').trim(); if(!v) return;
      if(k==='nombre'||k==='cliente') out.cliente=v;
      else if(k==='programa') out.programa=v;
      else if(k.startsWith('tipo')) out.tipo=v;
      else if(k.startsWith('dias')) out.diasEfectivos=v;
      else if(k.startsWith('objetivo')) out.objetivos=v.split(/;|\n/).map(s=>s.trim()).filter(Boolean);
    });
  }
  const sr = wb.SheetNames.find(n=>norm(n)==='rutina') || wb.SheetNames[sc?wb.SheetNames.findIndex(n=>n!==sc):0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sr],{defval:''});
  if(!rows.length) throw new Error('La hoja "Rutina" está vacía.');
  const get=(r,...keys)=>{ for(const k of Object.keys(r)) if(keys.includes(norm(k))) return r[k]; return ''; };
  rows.forEach(r=>{
    const bloque=String(get(r,'bloque','grupo')).trim(), ej=String(get(r,'ejercicio')).trim();
    if(!bloque||!ej) return;
    const dias=parseDias(get(r,'dias','dia')), circ=String(get(r,'circuito')).trim()||'Circuito 1';
    const reps=String(get(r,'reps','reps.','tiempo','repeticiones')).trim();
    const series=parseInt(get(r,'series'))||1, nota=String(get(r,'indicaciones','nota','notas')).trim();
    if(norm(bloque).includes('cardio')){ out.cardio.push({n:ej,tiempo:reps,nota}); return; }
    let b=out.bloques.find(x=>x.titulo===bloque);
    if(!b){ b={titulo:bloque,dias,circuitos:[]}; out.bloques.push(b); }
    let c=b.circuitos.find(x=>x.nombre===circ);
    if(!c){ c={nombre:circ,ejercicios:[]}; b.circuitos.push(c); }
    c.ejercicios.push({n:ej,reps,series,nota});
  });
  if(!out.bloques.length) throw new Error('No encontré ejercicios. Revisa las columnas: Bloque, Días, Circuito, Ejercicio, Reps, Series, Indicaciones.');
  return out;
}

function rutinaToWorkbook(r){
  const wb=XLSX.utils.book_new();
  const cli=[['Campo','Valor'],['Nombre',r.cliente],['Programa',r.programa],['Tipo de programación',r.tipo],
    ['Días efectivos',r.diasEfectivos],['Objetivos',(r.objetivos||[]).join('; ')]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cli),'Cliente');
  const rows=[['Bloque','Días','Circuito','Ejercicio','Reps','Series','Indicaciones']];
  r.bloques.forEach(b=>b.circuitos.forEach(c=>c.ejercicios.forEach(e=>
    rows.push([b.titulo,b.dias.join(','),c.nombre,e.n,e.reps,e.series,e.nota||'']))));
  (r.cardio||[]).forEach(c=>rows.push(['CARDIOVASCULAR','Diario','—',c.n,c.tiempo,1,c.nota||'']));
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:38},{wch:10},{wch:12},{wch:40},{wch:10},{wch:8},{wch:28}];
  XLSX.utils.book_append_sheet(wb,ws,'Rutina');
  return wb;
}

function download(name,blob){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
const slug = s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'rutina';
const say=(t,ok)=>{const m=$('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err')};

/* ---------------- Eventos admin ---------------- */
$('fab').onclick=()=>$('modal').classList.add('open');
$('btnClose').onclick=()=>$('modal').classList.remove('open');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
$('btnTpl').onclick=()=>{
  if(typeof XLSX==='undefined') return say('No se pudo cargar la librería de Excel (¿sin internet?).');
  XLSX.writeFile(rutinaToWorkbook(R),`plantilla-rutina-${slug(R.cliente)}.xlsx`);
};
$('file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    if(typeof XLSX==='undefined') throw new Error('No se pudo cargar la librería de Excel (¿sin internet?).');
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    R=excelToRutina(wb); selDay=todayNum;
    render(); say(`Rutina de ${R.cliente||'usuario'} cargada ✓`,true);
  }catch(err){ say(err.message||'No pude leer el archivo.'); }
  e.target.value='';
};

/* ---------------- Inicio ---------------- */
(async function init(){
  const url = params.get('u') ? `rutinas/${encodeURIComponent(params.get('u'))}.json` : 'rutina.json';
  try{ const r=await fetch(url,{cache:'no-store'}); if(r.ok) R=await r.json(); }catch(e){}
  render();
})();
</script>
